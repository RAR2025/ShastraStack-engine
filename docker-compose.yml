name: shastrastack

services:
  postgres:
    image: postgres:16-alpine
    container_name: shastrastack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shastra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shastra_pw}
      POSTGRES_DB: ${POSTGRES_DB:-shastrastack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shastra} -d ${POSTGRES_DB:-shastrastack}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: shastrastack-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-shastra}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change_me_local_only}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  rabbitmq-data:
